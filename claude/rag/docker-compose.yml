version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ai-team-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  qdrant-data:
    name: ai-team-qdrant-data
