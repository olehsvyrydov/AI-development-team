[project]
name = "multi-llm-consult"
version = "1.0.0"
description = "MCP server for multi-LLM consultation — get opinions from GPT, Gemini, Grok"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12",
    "openai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consult_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
