<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Dev Team — Hub</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#283040;
    --txt:#e6edf3; --dim:#8b949e; --accent:#6e56cf;
    --ok:#2ea043; --okbg:#12261a; --pend:#9e6a03; --pendbg:#2a1f06;
    --rej:#da3633; --rejbg:#2a1213; --hard:#da3633; --soft:#9e6a03;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:14px; padding:14px 20px;
           border-bottom:1px solid var(--line); background:linear-gradient(90deg,#161b22,#12101f); }
  header h1 { font-size:16px; margin:0; letter-spacing:.2px; }
  header h1 .dot { color:var(--accent); }
  .meta { display:flex; gap:8px; align-items:center; margin-left:auto; flex-wrap:wrap; }
  .badge { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .badge.preset { color:var(--txt); border-color:var(--accent); background:#1b1530; }
  .live { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
  .live i { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(46,160,67,.6);
            animation:pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(46,160,67,.5)} 70%{box-shadow:0 0 0 6px rgba(46,160,67,0)} 100%{box-shadow:0 0 0 0 rgba(46,160,67,0)} }
  main { display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:16px; padding:18px 20px; align-items:start; }
  section.col { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .col > h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
              margin:0; padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .col > h2 .count { color:var(--txt); }
  .list { padding:10px; display:flex; flex-direction:column; gap:8px; }
  .gate { background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--line);
          border-radius:8px; padding:10px 12px; }
  .gate.approved { border-left-color:var(--ok); }
  .gate.pending  { border-left-color:var(--pend); }
  .gate.rejected { border-left-color:var(--rej); }
  .gate .row1 { display:flex; align-items:center; gap:8px; }
  .gate .name { font-weight:600; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .gate .owner { color:var(--dim); font-size:12px; margin-left:auto; }
  .chips { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:11px; padding:2px 7px; border-radius:6px; border:1px solid var(--line); color:var(--dim); }
  .chip.state-approved { color:#7ee2a8; background:var(--okbg); border-color:#1f4a2e; }
  .chip.state-pending  { color:#e3b341; background:var(--pendbg); border-color:#4a3a13; }
  .chip.state-rejected { color:#ff7b72; background:var(--rejbg); border-color:#4a1f1f; }
  .chip.hard { color:#ff7b72; border-color:#4a1f1f; }
  .chip.soft { color:#e3b341; border-color:#4a3a13; }
  .chip.req  { color:#d2a8ff; border-color:#3a2a55; }
  .chip.safety { color:#ff7b72; border-color:#4a1f1f; }
  .item { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 12px;
          display:flex; align-items:center; gap:8px; }
  .item .id { font-family:ui-monospace,monospace; font-size:12px; color:var(--dim); }
  .item .title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .status { font-size:11px; padding:2px 7px; border-radius:6px; border:1px solid var(--line); color:var(--dim); }
  .empty { color:var(--dim); padding:16px; text-align:center; font-size:13px; }
  footer { color:var(--dim); font-size:12px; padding:8px 20px 20px; }
  code { font-family:ui-monospace,monospace; color:#d2a8ff; }
</style>
</head>
<body>
<header>
  <h1><span class="dot">◆</span> AI Dev Team <span style="color:var(--dim)">Hub</span></h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <section class="col"><h2>Workflow gates <span class="count" id="g-count">0</span></h2><div class="list" id="gates"></div></section>
  <section class="col"><h2>Tickets <span class="count" id="t-count">0</span></h2><div class="list" id="tickets"></div></section>
  <section class="col"><h2>Knowledge base <span class="count" id="k-count">0</span></h2><div class="list" id="kb"></div></section>
</main>
<footer id="foot">Connecting…</footer>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(st) {
  // header meta
  const m = [];
  m.push(`<span class="badge preset">preset: ${esc(st.preset)}</span>`);
  if (st.ticket) m.push(`<span class="badge">ticket: ${esc(st.ticket)}</span>`);
  if (st.changeClass) m.push(`<span class="badge">class: ${esc(st.changeClass)}</span>`);
  if (st.ledgerError) m.push(`<span class="badge" style="color:#ff7b72;border-color:#4a1f1f">ledger: ${esc(st.ledgerError)}</span>`);
  m.push(`<span class="live"><i></i>live</span>`);
  $('#meta').innerHTML = m.join('');

  // gates
  $('#g-count').textContent = st.gates.length;
  $('#gates').innerHTML = st.gates.length ? st.gates.map(g => `
    <div class="gate ${esc(g.state)}">
      <div class="row1">
        <span class="name">${esc(g.name)}</span>
        <span class="owner">${esc(g.owner)}</span>
      </div>
      <div class="chips">
        <span class="chip state-${esc(g.state)}">${esc(g.state)}</span>
        <span class="chip ${g.refusal==='hard'?'hard':'soft'}">${esc(g.refusal)}</span>
        ${g.required ? '<span class="chip req">required</span>' : ''}
        ${g.safety ? '<span class="chip safety">safety-override</span>' : ''}
      </div>
    </div>`).join('') : '<div class="empty">No gates found in workflow.yaml</div>';

  // tickets
  $('#t-count').textContent = st.tickets.length;
  $('#tickets').innerHTML = st.tickets.length ? st.tickets.map(t => `
    <div class="item"><span class="id">${esc(t.id)}</span>
      <span class="title" title="${esc(t.file)}">${esc(t.title)}</span>
      <span class="status">${esc(t.status)}</span></div>`).join('')
    : '<div class="empty">No tickets — file-based (Backlog.md / .aidevteam/tickets) when present</div>';

  // kb
  $('#k-count').textContent = st.kb.length;
  $('#kb').innerHTML = st.kb.length ? st.kb.map(d => `
    <div class="item"><span class="title" title="${esc(d.file)}">${esc(d.name)}</span></div>`).join('')
    : '<div class="empty">No knowledge base (docs/) yet</div>';

  $('#foot').innerHTML = `project <code>${esc(st.project)}</code> · workflow <code>${esc(st.workflow || '—')}</code> · updated ${new Date().toLocaleTimeString()}`;
}

const ev = new EventSource('/api/events');
ev.addEventListener('update', e => render(JSON.parse(e.data)));
ev.onerror = () => { $('#foot').textContent = 'Disconnected — retrying…'; };
</script>
</body>
</html>
